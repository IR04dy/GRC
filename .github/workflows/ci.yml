name: CI

# Runs on every push to master and on every pull request.
# Two jobs in parallel: backend (Maven verify) and frontend (Vite build + tsc).

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Cancel earlier in-flight runs of the same branch when a new commit lands.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Test secrets — only used inside the CI runners.
  JWT_SECRET: ci-test-secret-32-or-more-chars-not-a-placeholder-12345
  DB_USERNAME: sa
  DB_PASSWORD: ci-test-Sql123!

jobs:
  backend:
    name: Backend (Spring Boot, JDK 17)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Maven verify (compile + tests)
        working-directory: tss-grc-backend
        run: mvn -B -ntp verify

      - name: Upload test reports
        if: always()
        # Artifact upload is a convenience (diagnostic reports) — never let a
        # full Actions storage quota fail an otherwise-passing build.
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-reports
          path: tss-grc-backend/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 3

  frontend:
    name: Frontend (React + Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tss-grc-ui-v2
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node 20
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: tss-grc-ui-v2/package-lock.json

      - name: Install dependencies
        run: npm ci

      # The frontend guards this programme built to stop specific defect classes were
      # not enforced anywhere: `vitest` was absent from CI, so routeReachability.test.ts
      # (F2-07b — it found 8 shipped-but-unreachable screens) and
      # demoFallbackContract.test.ts (W2-1b — the mock-import ratchet, mutation-proven)
      # only ran when someone remembered. A ratchet nobody runs is a comment.
      - name: Vitest (route reachability + demo-fallback ratchets)
        run: npx vitest run

      # `vite build` succeeds today; `tsc -b` still has cosmetic noise (unused
      # imports, ~45 errors). Track separately — don't fail CI on it yet.
      - name: Vite build
        run: npx vite build

      - name: Upload build artifact
        if: always()
        # Don't fail the build when Actions artifact storage is full.
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: tss-grc-ui-v2/dist/
          if-no-files-found: ignore
          retention-days: 3

  docker:
    name: Docker image build (smoke)
    runs-on: ubuntu-latest
    needs: [backend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Build only — no push. A separate `build-image.yml` workflow handles
      # tagging and pushing to the registry on release tags.
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: tss/grc-platform:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
