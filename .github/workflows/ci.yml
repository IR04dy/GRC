name: CI

# Runs on every push to master and on every pull request.
# Two jobs in parallel: backend (Maven verify) and frontend (Vite build + tsc).

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Cancel earlier in-flight runs of the same branch when a new commit lands.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Test secrets — only used inside the CI runners.
  JWT_SECRET: ci-test-secret-32-or-more-chars-not-a-placeholder-12345
  DB_USERNAME: sa
  DB_PASSWORD: ci-test-Sql123!

jobs:
  backend:
    name: Backend (Spring Boot, JDK 17)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Maven verify (compile + tests)
        working-directory: tss-grc-backend
        run: mvn -B -ntp verify

      - name: Upload test reports
        if: always()
        # Artifact upload is a convenience (diagnostic reports) — never let a
        # full Actions storage quota fail an otherwise-passing build.
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-reports
          path: tss-grc-backend/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 3

  frontend:
    name: Frontend (React + Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tss-grc-ui-v2
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node 20
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: tss-grc-ui-v2/package-lock.json

      - name: Install dependencies
        run: npm ci

      # The frontend guards this programme built to stop specific defect classes were
      # not enforced anywhere: `vitest` was absent from CI, so routeReachability.test.ts
      # (F2-07b — it found 8 shipped-but-unreachable screens) and
      # demoFallbackContract.test.ts (W2-1b — the mock-import ratchet, mutation-proven)
      # only ran when someone remembered. A ratchet nobody runs is a comment.
      - name: Vitest (route reachability + demo-fallback ratchets)
        run: npx vitest run

      # DEP-5 — this step was `npx vite build`, under the comment "`vite build` succeeds
      # today; `tsc -b` still has cosmetic noise (unused imports, ~45 errors). Track
      # separately — don't fail CI on it yet." That was true when it was written and had not
      # been re-checked for five weeks. Measured 2026-09-06 and again 2026-09-14: `tsc -b`
      # exits 0 with no output. F2-36's recorded blocker is discharged.
      #
      # The gap it left was asymmetric with the release path. `package.json` is
      # `"build": "tsc -b && vite build"`, so the documented RELEASE build gated on types
      # while CI did not — a type error merged to master kept CI green and made every
      # subsequent release build fail, found at deploy time by the operator rather than at
      # merge time by the author. Types are load-bearing here: dozens of closed findings cite
      # "tsc clean" as a verification leg, and F2-211's own words are that once a DTO stops
      # declaring a field "`tsc` already refuses" it.
      - name: Build (tsc -b + vite build)
        run: npm run build

      - name: Upload build artifact
        if: always()
        # Don't fail the build when Actions artifact storage is full.
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: tss-grc-ui-v2/dist/
          if-no-files-found: ignore
          retention-days: 3

  # F2-19b — run the measurement scripts in CI so the baseline cannot drift.
  #
  # ⚠ The guard already existed and nothing ran it. `baseline_census.py` has carried `--no-db
  # --check` (exit 1 when a gated figure drifts) since F2-69 built it, and it was never wired to a
  # runner — the same shape as `vitess`/`vitest` being absent from CI, which let 8 unreachable
  # screens ship. On its first run in anger it immediately found live drift: MEASURED_BASELINE.md
  # said 15 zero-test packages against a tree holding 8, because F2-03 floored seven of them.
  #
  # ⚠ What actually blocked this was a PATH, not a database. Three of the four scripts hardcoded
  # `ROOT = r"D:\AYMAN\GRC"`, so none could run on a Linux runner; `baseline_census.py` already
  # derived its root from `__file__` and the pattern had simply not spread. All four now do, with
  # `GRC_ROOT` as an override, and a bogus root fails loudly rather than measuring the wrong tree.
  #
  # No database here on purpose: `--no-db` skips the two dev/prod row-count sections and every
  # source-derived figure — packages, entities, schemas, migrations, permissions — is still checked.
  # Those are also gated inside the Java suite by MeasuredBaselineFreshnessTest, so this job is the
  # belt to that braces: it catches the figures the test does not cover, and it catches the scripts
  # themselves breaking.
  measurement:
    name: Measurement scripts (the baseline cannot drift)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: TSS-GRC-Platform-Bible/Appendix/scripts
    steps:
      - uses: actions/checkout@v7
        with:
          # doc_register.py reads `git log` per .md for provenance; a shallow clone reports none.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Baseline census — fails when a gated figure drifts from MEASURED_BASELINE.md
        run: python baseline_census.py --no-db --check

      # Each of the three below carries a non-vacuity floor and exits 1 when its scan collapses.
      # F2-69 is why: the entity predicate broke once and the document published 417 for a tree of
      # 413, because nothing checked that the measurement was plausible. A scan that finds nothing
      # must never read as a clean one.
      - name: Coupling graph — fails when the census collapses
        run: python coupling.py

      - name: Boundary readings — F2-34's two readings, priced (fails when the import scan collapses)
        run: python boundary_readings.py

      - name: Documentation register — fails on a crash; regenerates DOCUMENT_REGISTER.csv
        run: python doc_register.py

      # ⚠ Deliberately NOT a `git diff --exit-code` on the generated artefacts. `coupling.json` moves
      # with every code change and `DOCUMENT_REGISTER.csv` embeds git dates, so a byte-diff would fail
      # on essentially every commit and be disabled within a week — §1c's own rule that a ratchet
      # nobody runs is a comment. The drift that matters is a PUBLISHED FIGURE going stale, and
      # `--check` is the assertion for exactly that.
      - name: Upload regenerated measurement artefacts
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: measurement-artefacts
          path: |
            TSS-GRC-Platform-Bible/Appendix/scripts/coupling.json
            TSS-GRC-Platform-Bible/Appendix/DOCUMENT_REGISTER.csv
          if-no-files-found: ignore
          retention-days: 3

  docker:
    name: Docker image build (smoke)
    runs-on: ubuntu-latest
    needs: [backend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Build only — no push. A separate `build-image.yml` workflow handles
      # tagging and pushing to the registry on release tags.
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: tss/grc-platform:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
