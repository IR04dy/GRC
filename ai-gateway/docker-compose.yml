version: '3.8'

services:
  # LiteLLM AI Gateway Proxy
  litellm-gateway:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: tss_ai_gateway
    ports:
      - "4000:4000"
    volumes:
      - ./config.yaml:/app/config.yaml
      - ./gateway_hook.py:/app/gateway_hook.py
      - ./guardrails:/app/guardrails
    environment:
      - PORT=4000
      - STORE_MODEL_IN_DB=False
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    command: ["--config", "/app/config.yaml", "--detailed_debug"]
    depends_on:
      - redis
    restart: unless-stopped

  # Redis for High-Performance Exact & Semantic Caching
  redis:
    image: redis:7-alpine
    container_name: tss_ai_gateway_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped

  # Microsoft Presidio PII Analyzer (Optional dedicated microservice)
  presidio:
    image: mcr.microsoft.com/presidio-analyzer:latest
    container_name: tss_ai_presidio
    ports:
      - "5001:3000"
    restart: unless-stopped

volumes:
  redis_data:
