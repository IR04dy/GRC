version: '3.8'

services:
  # LiteLLM AI Gateway Proxy
  litellm-gateway:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: tss_ai_gateway
    # Published on the host's loopback only; the backend reaches it at localhost:4000.
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - ./config.yaml:/app/config.yaml
      - ./gateway_hook.py:/app/gateway_hook.py
      - ./guardrails:/app/guardrails
    environment:
      - PORT=4000
      # Required: config.yaml reads the master key from here, and compose refuses to start without it.
      - GATEWAY_MASTER_KEY=${GATEWAY_MASTER_KEY:?Set GATEWAY_MASTER_KEY to the backend's AI_GATEWAY_API_KEY value}
      - STORE_MODEL_IN_DB=False
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    command: ["--config", "/app/config.yaml", "--detailed_debug"]
    depends_on:
      - redis
    restart: unless-stopped

  # Redis for High-Performance Exact & Semantic Caching
  redis:
    image: redis:7-alpine
    container_name: tss_ai_gateway_redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped

  # Microsoft Presidio PII Analyzer (Optional dedicated microservice)
  presidio:
    image: mcr.microsoft.com/presidio-analyzer:latest
    container_name: tss_ai_presidio
    ports:
      - "127.0.0.1:5001:3000"
    restart: unless-stopped

volumes:
  redis_data:
