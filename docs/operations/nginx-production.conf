# TSS GRC Platform — production nginx configuration
#
# Closes Open Issue #011 (Nginx production config not committed).
#
# Setup: terminates TLS, serves the React SPA from /var/www/tss-grc-ui-v2/dist,
# and reverse-proxies /api/* to the Spring Boot backend on 127.0.0.1:8084.
#
# Hardening assumptions baked in:
#   • HSTS preload window enabled
#   • Modern TLS only (TLSv1.2 + TLSv1.3)
#   • Real client IP forwarded to the backend
#   • Static asset caching with content-hashed filenames
#   • Server tokens off
#   • Security response headers per OWASP Secure Headers Project + NCA ECC-2 control 2-9
#
# Adjust hostnames + cert paths before going live.

user www-data;
worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    # ── Core ────────────────────────────────────────────────────────────
    include             /etc/nginx/mime.types;
    default_type        application/octet-stream;
    server_tokens       off;
    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65;
    types_hash_max_size 4096;
    client_max_body_size 32m;
    client_body_timeout  30s;
    client_header_timeout 30s;
    send_timeout         60s;
    server_names_hash_bucket_size 128;

    # ── TLS defaults ────────────────────────────────────────────────────
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers               ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_ecdh_curve            secp384r1:secp521r1;
    ssl_session_timeout       1d;
    ssl_session_cache         shared:TLSCache:50m;
    ssl_session_tickets       off;
    ssl_stapling              on;
    ssl_stapling_verify       on;
    resolver                  1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout          5s;

    # ── Logging ─────────────────────────────────────────────────────────
    log_format json_combined escape=json
        '{'
        '"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"x_forwarded_for":"$http_x_forwarded_for",'
        '"request":"$request",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_response_time":"$upstream_response_time",'
        '"http_referer":"$http_referer",'
        '"http_user_agent":"$http_user_agent",'
        '"request_id":"$request_id"'
        '}';
    access_log /var/log/nginx/access.log json_combined;
    error_log  /var/log/nginx/error.log warn;

    # ── Compression ─────────────────────────────────────────────────────
    gzip               on;
    gzip_vary          on;
    gzip_comp_level    6;
    gzip_min_length    1024;
    gzip_proxied       any;
    gzip_types         text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml application/x-font-ttf font/opentype font/woff font/woff2;

    # ── Rate limit zones ────────────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=api_default:20m rate=60r/m;
    limit_req_zone $binary_remote_addr zone=api_auth:20m    rate=10r/m;
    limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;

    # ── HTTP → HTTPS redirect ───────────────────────────────────────────
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # ── Main HTTPS server ───────────────────────────────────────────────
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name grc.example.sa;

        ssl_certificate     /etc/ssl/tssgrc/fullchain.pem;
        ssl_certificate_key /etc/ssl/tssgrc/privkey.pem;
        ssl_trusted_certificate /etc/ssl/tssgrc/chain.pem;

        # Security headers (NCA ECC-2 / OWASP Secure Headers)
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "accelerometer=(), camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-site" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' wss://grc.example.sa; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

        # Don't index in search engines
        add_header X-Robots-Tag "noindex, nofollow" always;

        # Connection limits
        limit_conn conn_per_ip 50;

        # Backend API proxy
        location /api/ {
            limit_req zone=api_default burst=30 nodelay;

            proxy_pass         http://127.0.0.1:8084;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Request-ID      $request_id;
            proxy_set_header   Connection        "";

            proxy_connect_timeout 10s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;

            proxy_buffering    on;
            proxy_buffer_size  4k;
            proxy_buffers      8 8k;
        }

        # Auth endpoints — tighter rate limit
        location ~ ^/api/(auth|login|register|password) {
            limit_req zone=api_auth burst=5 nodelay;

            proxy_pass         http://127.0.0.1:8084;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # WebSocket / STOMP endpoint
        location /ws/ {
            proxy_pass         http://127.0.0.1:8084;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # Hashed assets — cache aggressively
        location ~* \.(?:css|js|woff2?|ttf|otf|eot|svg|png|jpe?g|webp|ico)$ {
            root /var/www/tss-grc-ui-v2/dist;
            expires 1y;
            access_log off;
            add_header Cache-Control "public, immutable, max-age=31536000";
            try_files $uri =404;
        }

        # SPA shell — never cache index.html so deploys roll forward
        location / {
            root /var/www/tss-grc-ui-v2/dist;
            index index.html;
            try_files $uri /index.html;
            add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
            expires off;
        }

        # Healthcheck (open, no rate limit)
        location = /healthz {
            access_log off;
            proxy_pass http://127.0.0.1:8084/actuator/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # Block hidden dotfiles + backup files
        location ~ /\.(ht|git|env) { deny all; access_log off; }
        location ~ ~$            { deny all; access_log off; }
    }
}
