# ============================================================================
# TSS GRC Platform — Development Profile
# Activate: --spring.profiles.active=dev
# ============================================================================

spring:
  autoconfigure:
    # Disable unused auto-configs in dev to avoid health check noise
    exclude:
      - org.springframework.boot.autoconfigure.ldap.LdapAutoConfiguration
      - org.springframework.boot.autoconfigure.mail.MailSenderAutoConfiguration

  datasource:
    # Secrets are sourced from environment variables. For day-one local dev
    # the variables fall back to documented defaults — see
    # docs/diagrams/16-secrets-management.md for the recommended setup
    # (Vault / Azure Key Vault / AWS Secrets Manager for non-dev environments).
    url:      ${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=TSS_GRC;encrypt=true;trustServerCertificate=true;sendStringParametersAsUnicode=true}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:CHANGE_ME_IN_ENV}
    hikari:
      minimum-idle: 2
      maximum-pool-size: 10

  jpa:
    hibernate:
      ddl-auto: none          # DB already created manually; Hibernate only validates
    show-sql: true
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: false            # DB created manually; Flyway disabled for dev

  devtools:
    restart:
      enabled: true

logging:
  level:
    root: WARN
    com.tss.grc: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG

server:
  port: 8084

grc:
  jwt:
    # JWT secret must be sourced from JWT_SECRET env var. The literal default
    # is intentionally a recognisably-broken placeholder so an unconfigured
    # deployment fails loudly at first authentication rather than silently
    # using a known-bad secret.
    secret: ${JWT_SECRET:CHANGE_ME_PROVIDE_JWT_SECRET_VIA_ENVIRONMENT_VARIABLE_AT_LEAST_32_CHARS}
    access-token-expiry-ms: 3600000       # 1 hour in dev
    refresh-token-expiry-ms: 604800000
  cors:
    allowed-origins: "http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174,http://localhost:5500,http://127.0.0.1:5500,http://localhost:8086,http://127.0.0.1:8086,http://localhost:8087,http://127.0.0.1:8087"
  security:
    max-failed-login-attempts: 99
    lockout-duration-minutes: 1

  # Sprint 12 — ServiceNow ITSM integration. In dev we explicitly enable
  # the adapter in STUB mode so smoke tests against /api/v1/integrations/servicenow
  # work out of the box. Flip mode=LIVE + set SERVICENOW_* env vars to talk
  # to a real instance.
  integrations:
    servicenow:
      enabled: true
      mode: STUB
      base-url: https://acme-dev.service-now.com

    # Splunk SIEM bridge — enabled in STUB so the SOC routes work
    # out of the box. Flip mode=LIVE + set SPLUNK_HEC_TOKEN to talk
    # to a real HEC endpoint.
    splunk:
      enabled: true
      mode: STUB
      hec-url: https://splunk-dev.example.sa:8088/services/collector/event
      default-index: tss_grc_dev
      default-sourcetype: grc:event:json

springdoc:
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

# ─────────────────────────────────────────────────────────────────────────────
# BCM mass-notification channels (audit Tier-2)
#
# Each channel is gated by its `.enabled` flag and stays dormant otherwise,
# so the CrisisCommsService falls back to its SIMULATED behaviour until
# a real channel is configured. Point spring.mail.* at a real SMTP relay
# (or local MailHog/Mailpit during dev) before flipping enabled to true.
#
#   bcm:
#     notify:
#       email:
#         enabled: true
#         from:    bcm-noreply@grc-dev.local
#
#   spring:
#     mail:
#       host: localhost
#       port: 1025
# ─────────────────────────────────────────────────────────────────────────────
bcm:
  notify:
    email:
      enabled: false
      from:    bcm-noreply@example.com
