# ============================================================================
# TSS GRC Platform — Development Profile
# Activate: --spring.profiles.active=dev
# ============================================================================

spring:
  # 10 repository class-name duplicates currently exist across modules
  # (Audit/CAPA/Control/Vendor/Vulnerability legacy vs new package homes,
  # plus Sprint 13 KRI + Sanctions). Override lets Spring pick the last-loaded
  # bean per name. Tech-debt: rename or @Repository("legacy*") on each pair.
  main:
    allow-bean-definition-overriding: true
  autoconfigure:
    # Disable unused auto-configs in dev to avoid health check noise
    exclude:
      - org.springframework.boot.autoconfigure.ldap.LdapAutoConfiguration
      - org.springframework.boot.autoconfigure.mail.MailSenderAutoConfiguration

  datasource:
    # Secrets are sourced from environment variables. For day-one local dev
    # the variables fall back to documented defaults — see
    # docs/diagrams/16-secrets-management.md for the recommended setup
    # (Vault / Azure Key Vault / AWS Secrets Manager for non-dev environments).
    url:      ${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=TSS_GRC;encrypt=true;trustServerCertificate=true;sendStringParametersAsUnicode=true}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:CHANGE_ME_IN_ENV}
    hikari:
      minimum-idle: 2
      maximum-pool-size: 10

  jpa:
    hibernate:
      ddl-auto: none          # DB already created manually; Hibernate only validates
    show-sql: true
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: false            # DB created manually; Flyway disabled for dev

  devtools:
    restart:
      enabled: true

logging:
  level:
    root: WARN
    com.tss.grc: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG

server:
  port: 8084

grc:
  # SEC-CFG-001 — verbose error diagnostics (exception class name + SQL
  # root-cause message echoed in the HTTP response) are DEV ONLY. Base/prod
  # leave this at its false default so unhandled errors return only a generic
  # message + correlation reference; the full detail stays in the server log.
  errors:
    verbose: true
  jwt:
    # JWT secret must be sourced from JWT_SECRET env var. The literal default
    # is intentionally a recognisably-broken placeholder so an unconfigured
    # deployment fails loudly at first authentication rather than silently
    # using a known-bad secret.
    secret: ${JWT_SECRET:CHANGE_ME_PROVIDE_JWT_SECRET_VIA_ENVIRONMENT_VARIABLE_AT_LEAST_32_CHARS}
    access-token-expiry-ms: 3600000       # 1 hour in dev
    refresh-token-expiry-ms: 604800000
  cors:
    # Exact localhost/127.0.0.1 origins for same-machine dev, plus private-LAN
    # wildcard patterns (192.168.x / 10.x / 172.x on any port) so the dev UI is
    # reachable from another machine on the LAN without per-IP config. These are
    # treated as allowed-origin PATTERNS (see CorsConfig) — wildcards work with
    # credentials. DEV ONLY; prod is same-origin behind Nginx.
    allowed-origins: "http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174,http://localhost:5500,http://127.0.0.1:5500,http://localhost:8086,http://127.0.0.1:8086,http://localhost:8087,http://127.0.0.1:8087,http://192.168.*:[*],http://10.*:[*],http://172.*:[*]"
  security:
    max-failed-login-attempts: 99
    lockout-duration-minutes: 1

  # CY-D — make the SLA escalation clock actually tick. The scheduler defaults to
  # enabled=false (see VulnerabilitySlaScheduler) and NO profile turned it on, so
  # last_escalation_at never got stamped in any environment. Enable it in dev with
  # a short interval so the demo clock is responsive and the escalation path is
  # observable end-to-end.
  vuln-sla:
    scheduler-enabled: true
    scheduler-interval-ms: 60000          # 1 min in dev (prod uses the 5-min default)
  # The SOC-ops time-based F8 sweep has no enable flag (always runs); shorten its
  # dev cadence so overdue SLAs / expiring certs / due reviews fire promptly.
  socops:
    sweep-initial-delay-ms: 20000         # first sweep ~20s after boot
    sweep-period-ms: 120000               # 2 min in dev (prod uses the 1-hour default)
  # CY-E — cyber CAPA/action-plan reminder + overdue-escalation clock. Short dev
  # cadence so a routed CAPA's escalation is observable end-to-end.
  cyber-capa-sla:
    scheduler-enabled: true
    scheduler-interval-ms: 60000          # 1 min in dev (prod uses the 5-min default)

  # Sprint 12 — ServiceNow ITSM integration. In dev we explicitly enable
  # the adapter in STUB mode so smoke tests against /api/v1/integrations/servicenow
  # work out of the box. Flip mode=LIVE + set SERVICENOW_* env vars to talk
  # to a real instance.
  integrations:
    servicenow:
      enabled: true
      mode: STUB
      base-url: https://acme-dev.service-now.com

    # Splunk SIEM bridge — enabled in STUB so the SOC routes work
    # out of the box. Flip mode=LIVE + set SPLUNK_HEC_TOKEN to talk
    # to a real HEC endpoint.
    splunk:
      enabled: true
      mode: STUB
      hec-url: https://splunk-dev.example.sa:8088/services/collector/event
      default-index: tss_grc_dev
      default-sourcetype: grc:event:json

    # CrowdStrike Falcon EDR — enabled in STUB so the SOC routes work
    # out of the box. The scheduled poll loop stays OFF in dev so we don't
    # spam the audit log with synthetic detections on every boot.
    crowdstrike:
      enabled: true
      mode: STUB
      base-url: "https://api.eu-1.crowdstrike.com"
      polling-enabled: false
      polling-interval-seconds: 60

    # Tenable VM — enabled in STUB so the /api/v1/integrations/tenable routes
    # work out of the box. The scheduled poll loop stays OFF in dev so we don't
    # spam cyber.vulnerabilities with synthetic findings on every boot.
    tenable:
      enabled: true
      mode: STUB
      platform: IO
      base-url: "https://cloud.tenable.com"
      polling-enabled: false
      polling-interval-seconds: 900

springdoc:
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

# ─────────────────────────────────────────────────────────────────────────────
# BCM mass-notification channels (audit Tier-2)
#
# Each channel is gated by its `.enabled` flag and stays dormant otherwise,
# so the CrisisCommsService falls back to its SIMULATED behaviour until
# a real channel is configured. Point spring.mail.* at a real SMTP relay
# (or local MailHog/Mailpit during dev) before flipping enabled to true.
#
#   bcm:
#     notify:
#       email:
#         enabled: true
#         from:    bcm-noreply@grc-dev.local
#
#   spring:
#     mail:
#       host: localhost
#       port: 1025
# ─────────────────────────────────────────────────────────────────────────────
bcm:
  notify:
    email:
      enabled: false
      from:    bcm-noreply@example.com
