# ============================================================================
# TSS GRC Platform — Production Profile Configuration
# Activate: --spring.profiles.active=prod
# All sensitive values MUST be supplied via environment variables.
# ============================================================================

spring:
  datasource:
    url: ${DB_URL}                         # jdbc:sqlserver://HOST:1433;databaseName=TSS_GRC;encrypt=true;trustServerCertificate=false;hostNameInCertificate=*.yourdomain.com;sendStringParametersAsUnicode=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 60000

  jpa:
    hibernate:
      # Schema is Flyway-managed; the long-lived DB mixes smallint/bit for
      # is_deleted (Python-bootstrapped era), so strict validation fails on
      # false drift (first hit: ai_governance.ai_lifecycle_event.is_deleted,
      # live-verified 2026-07-11). Keep OFF like dev; flip to `validate` via
      # HIBERNATE_DDL_AUTO once column types are reconciled.
      ddl-auto: ${HIBERNATE_DDL_AUTO:none}
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration/sqlserver
    # baseline-on-migrate: a fresh empty DB is migrated from V1 onwards.
    # For an EXISTING DB (restored backup / Python-bootstrapped) set
    # FLYWAY_BASELINE_VERSION to the newest migration already present (e.g. 292)
    # so Flyway records a baseline and only applies newer versions.
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:true}
    baseline-version: ${FLYWAY_BASELINE_VERSION:0}
    # The emptiness check that triggers baseline-on-migrate runs against the
    # DEFAULT schema. The platform's data lives in named schemas (platform, iam,
    # …) while the connection default (dbo) stays empty — so point Flyway at
    # `platform`: a restored DB is then correctly detected as non-empty and
    # BASELINED (live-verified 2026-07-11; with dbo it wrongly re-ran V1/V2).
    # History table becomes platform.flyway_schema_history. A truly fresh DB
    # still migrates from V1 (V1 creates the schemas idempotently).
    default-schema: ${FLYWAY_DEFAULT_SCHEMA:platform}
    clean-disabled: true                   # NEVER run flyway:clean in production
    validate-on-migrate: true

  thymeleaf:
    cache: true                            # Enable template caching

  devtools:
    restart:
      enabled: false
    livereload:
      enabled: false

  mail:
    # Safe defaults so the app boots before a real SMTP relay is configured;
    # set the SMTP_* values in external.properties to enable delivery.
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

logging:
  level:
    root: WARN
    com.tss.grc: INFO
    org.springframework.security: WARN
    org.springframework.web: WARN
    org.hibernate.SQL: ERROR
    org.flywaydb: INFO
  file:
    # Linux default; on Windows set LOGGING_FILE_NAME=C:/tss-grc/logs/application.log
    name: ${LOGGING_FILE_NAME:/var/log/tss-grc/application.log}
  logback:
    rollingpolicy:
      max-file-size: 50MB
      max-history: 30
      total-size-cap: 1GB

server:
  # Overridable from external.properties: behind a TLS-terminating reverse
  # proxy (nginx/IIS) set SERVER_PORT=8084, SERVER_SSL_ENABLED=false and bind
  # to loopback with SERVER_ADDRESS=127.0.0.1.
  port: ${SERVER_PORT:8443}
  address: ${SERVER_ADDRESS:0.0.0.0}
  ssl:
    enabled: ${SERVER_SSL_ENABLED:true}
    # Empty defaults so a proxy-terminated deployment (ssl.enabled=false) boots
    # without a keystore; when SSL is on, a missing path fails fast and loudly.
    key-store: ${SSL_KEYSTORE_PATH:}
    key-store-password: ${SSL_KEYSTORE_PASSWORD:}
    key-store-type: PKCS12
    key-alias: tss-grc
  servlet:
    session:
      timeout: 30m
      cookie:
        secure: true
        http-only: true
        same-site: strict
  compression:
    enabled: true
    mime-types: text/html,text/css,application/javascript,application/json
    min-response-size: 2048
  http2:
    enabled: true

sentry:
  # Sprint 4 §4.4 — error tracking. Auto-disabled when SENTRY_DSN is missing.
  dsn: ${SENTRY_DSN:}
  environment: ${SENTRY_ENV:prod}
  release: ${SENTRY_RELEASE:tss-grc-platform@0.1.0-SNAPSHOT}
  traces-sample-rate: 0.1                  # 10% of requests for performance tracing
  send-default-pii: false                  # Never send raw user identifiers
  in-app-includes: com.tss.grc

grc:
  security:
    session-timeout-minutes: 30
    max-login-attempts: 5
    lockout-duration-minutes: 30
    # SEC-CFG-009 — platform-wide Hibernate-level cross-tenant write backstop
    # (TenantWriteGuardInterceptor). The per-service setId(null)/org-scoping
    # checks remain the primary defense; this is defense-in-depth that must be
    # ON in production so a single missed per-service guard cannot silently
    # write across tenants. Activate only after the documented staging soak
    # (docs/security/MASS_ASSIGNMENT_DEFENSE.md) — watch the audit log for any
    # SECURITY_BLOCK entries on legitimate flows before relying on it.
    #
    # ⚠ F2-149 — this MUST stay a ${PLACEHOLDER}, never a bare `true`.
    # It was `enabled: true` written literally here, and on 2026-08-02 an operator
    # put `grc.security.tenant-write-guard.enabled=false` in external.properties to
    # mitigate a P0. It had NO EFFECT: external.properties arrives through
    # `spring.config.import` in application.yml, and a profile-specific document
    # outranks application.yml and everything it imports. Production booted the next
    # day still logging "[TenantWriteGuard] interceptor WIRED" — which this bean emits
    # only when enabled=true — and the finding recorded the flag as OFF for four days.
    # A kill-switch that cannot be thrown is not a kill-switch.
    # `ExternalConfigOverrideContractTest` now fails the build if this reverts.
    tenant-write-guard:
      enabled: ${TENANT_WRITE_GUARD_ENABLED:true}
  # CY-D — the risk-based vulnerability-SLA escalation clock MUST run in production
  # (the scheduler defaults OFF; its Javadoc says prod flips it on but no config did,
  # so last_escalation_at / breach notifications never fired). 5-min default cadence.
  # Placeholder per F2-149: a scheduler that misfires in production must be stoppable
  # without a rebuild.
  vuln-sla:
    scheduler-enabled: ${VULN_SLA_SCHEDULER_ENABLED:true}
  # CY-E — cyber CAPA/action-plan reminder + overdue-escalation clock (5-min default cadence).
  cyber-capa-sla:
    scheduler-enabled: ${CYBER_CAPA_SLA_SCHEDULER_ENABLED:true}
  # CY-J — cyber evidence expiry sweep MUST run in production so expired evidence is caught +
  # re-requested for NCA/SAMA reviews (1-hour default cadence).
  cyber-evidence-expiry:
    scheduler-enabled: ${CYBER_EVIDENCE_EXPIRY_SCHEDULER_ENABLED:true}
  # WF-2 — workflow-request SLA clock (reminders + overdue escalation; 5-min default cadence).
  workflow-request-sla:
    scheduler-enabled: ${WORKFLOW_REQUEST_SLA_SCHEDULER_ENABLED:true}
  storage:
    # F2-456: prod prefers FILE_STORAGE_PATH and accepts STORAGE_BASE_PATH, so an
    # operator who set either one gets a consistent answer for attachments,
    # evidence AND binder exports rather than two roots.
    base-path: ${FILE_STORAGE_PATH:${STORAGE_BASE_PATH:/var/data/tss-grc/uploads}}
  notifications:
    from-email: ${NOTIFY_FROM_EMAIL:noreply@tss-grc.com}
    from-name: TSS GRC Platform

springdoc:
  swagger-ui:
    enabled: false                         # Disable Swagger UI in production
  api-docs:
    enabled: false

management:
  health:
    # Optional infrastructure must not flip liveness DOWN (nginx/monitors key
    # off /actuator/health). LDAP (AD integration) and SMTP are auto-probed by
    # Boot the moment their starters are on the classpath — live-verified
    # 2026-07-11: no LDAP server => ldap=DOWN => overall DOWN. Re-enable via
    # external.properties once a real directory / mail relay is wired.
    ldap:
      enabled: ${LDAP_HEALTH_ENABLED:false}
    mail:
      enabled: ${MAIL_HEALTH_ENABLED:false}
  endpoints:
    web:
      exposure:
        # Sprint 4 §4.4 — added prometheus for scraping by Grafana / VictoriaMetrics.
        # Management port is 8090 (separate from app port 8443); only expose to
        # the metrics-collector network, never to the public internet.
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: never
    prometheus:
      access: read_only
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true       # Enable percentile histograms for HTTP latency
    tags:
      application: tss-grc-platform
      environment: prod
  server:
    port: ${MANAGEMENT_SERVER_PORT:8090}   # Actuator on separate port, not exposed publicly
    address: ${MANAGEMENT_SERVER_ADDRESS:127.0.0.1}
