# ============================================================================
# TSS GRC Platform — Application Configuration (REST API Backend)
# Profile: default (common settings across all environments)
#
# Frontend: tss-grc-ui/ — standalone HTML/CSS/JS project served separately.
# This backend exposes ONLY a REST API (no Thymeleaf, no server-side rendering).
# ============================================================================

spring:
  application:
    name: tss-grc-platform

  # External configuration file — lives NEXT TO the jar (working directory), so
  # operators can change any property without rebuilding. Values defined there
  # win over the packaged defaults (they feed the ${PLACEHOLDER} references
  # below and in the profile files; raw spring keys work too). `optional:` so
  # dev runs and the test suite still boot when the file is absent.
  config:
    import: optional:file:./external.properties

  # Multipart upload limits. These MUST live under spring.servlet.multipart —
  # Spring Boot ignores server.servlet.multipart, so the previous override there
  # silently left the 1MB default in force (real policy/evidence uploads >1MB
  # failed with a size error). Frontend AttachmentsField caps at 50MB to match.
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 55MB

  # PERF-PG-003 — global pagination guard. Spring's PageableHandlerMethodArgument
  # Resolver clamps any client-supplied ?size= to max-page-size, so a paginated
  # Page<> endpoint can no longer be coerced into materialising the whole table
  # with ?size=1000000. default-page-size applies when ?size= is omitted.
  # (Hand-rolled size params — e.g. AuditLogController, the platform pageOf
  # helpers — additionally clamp with Math.min(size, …) in code.)
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

  # SQL Server Datasource
  datasource:
    url: ${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=TSS_GRC;encrypt=true;trustServerCertificate=true;sendStringParametersAsUnicode=true}
    username: ${DB_USERNAME:grc_app}
    password: ${DB_PASSWORD:}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    hikari:
      pool-name: GrcHikariPool
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 300000        # 5 minutes
      connection-timeout: 30000   # 30 seconds
      max-lifetime: 1800000       # 30 minutes
      leak-detection-threshold: 60000

  # JPA / Hibernate
  jpa:
    hibernate:
      ddl-auto: validate            # Flyway manages schema; Hibernate validates
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        default_schema: platform
        jdbc:
          time_zone: UTC
        globally_quoted_identifiers: false

  # Flyway database migrations
  flyway:
    enabled: true
    locations: classpath:db/migration/sqlserver
    baseline-on-migrate: false
    out-of-order: false
    validate-on-migrate: true
    table: flyway_schema_history
    encoding: UTF-8
    clean-disabled: true           # NEVER allow clean (especially in production)
    connect-retries: 3

  # Email (SMTP) — for notification delivery
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 10000

  # Cache (Caffeine) — dashboard aggregations, permission lookups
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=300s

  # Jackson — JSON serialization settings
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
    time-zone: UTC

# Server configuration
server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  error:
    include-message: on_param
    include-binding-errors: on_param

# Spring Boot Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: when_authorized
  info:
    app:
      name: TSS GRC Platform
      version: ${project.version:0.1.0}

# SpringDoc OpenAPI 3.0 (Swagger UI — disabled in prod via profile)
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${SWAGGER_ENABLED:false}
  info:
    title: TSS GRC Platform API
    description: Enterprise GRC REST API — consumed by the tss-grc-ui frontend and third-party integrations
    version: v1

# Application-specific settings
grc:
  # JWT authentication
  jwt:
    # No default — JwtTokenProvider.@PostConstruct fails fast if missing/weak.
    # Provide via JWT_SECRET env var; minimum 32 chars; must not start with placeholder text.
    secret: ${JWT_SECRET:}
    # Optional rotation overlap key — see docs/operations/jwt-secret-rotation.md.
    # During the 24h rotation window: set this to the OLD value of JWT_SECRET, set
    # JWT_SECRET to the new value, restart. Clear after the window. Verification
    # only — never used for signing.
    secret-previous: ${JWT_SECRET_PREVIOUS:}
    access-token-expiry-ms: ${JWT_ACCESS_EXPIRY_MS:900000}        # 15 minutes
    refresh-token-expiry-ms: ${JWT_REFRESH_EXPIRY_MS:604800000}   # 7 days

  # CORS — allowed origins for the standalone frontend
  # In production, set to empty list (same-origin via Nginx reverse proxy)
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

  # Security policies
  security:
    max-failed-login-attempts: 5
    lockout-duration-minutes: 30
    password-expiry-days: 90
    password-history-count: 5

  # File storage (evidence attachments, report exports)
  storage:
    base-path: ${STORAGE_BASE_PATH:./uploads}
    max-file-size-mb: 50
    allowed-extensions: pdf,doc,docx,xls,xlsx,png,jpg,jpeg,zip,txt

  # Notification settings
  notifications:
    from-email: ${NOTIFY_FROM_EMAIL:noreply@tss-grc.com}
    from-name: TSS GRC Platform

  # Platform defaults
  default-locale: en
  supported-locales: en,ar

  # Integrations — outbound adapters to third-party systems
  # See tss-grc-backend/docs/integrations/SERVICENOW.md for operator notes.
  integrations:
    servicenow:
      enabled: false                              # default OFF; flip per-env
      mode: STUB                                  # STUB (in-memory) | LIVE (real HTTP)
      base-url: https://example.service-now.com
      auth:
        type: OAUTH2_CLIENT_CREDENTIALS           # OAUTH2_CLIENT_CREDENTIALS | BASIC
        client-id: ${SERVICENOW_CLIENT_ID:}
        client-secret: ${SERVICENOW_CLIENT_SECRET:}
        token-url: ${SERVICENOW_TOKEN_URL:}
        username: ${SERVICENOW_USERNAME:}
        password: ${SERVICENOW_PASSWORD:}
      timeout-seconds: 10          # PERF-IO-003: 30s -> 10s (4 attempts stay under 60s leak threshold)
      max-retries: 3
      defaults:
        impact: 3                                 # ServiceNow 1=high, 3=low
        urgency: 3
        category: Security

    # Splunk SIEM bridge (slice 2 — see docs/integrations/SPLUNK.md).
    # HEC token auth (not OAuth). Push pulls from socops.security_event;
    # webhook accepts Splunk saved-search alerts.
    splunk:
      enabled: false                              # default OFF; flip per-env
      mode: STUB                                  # STUB (in-memory) | LIVE (real HEC HTTP)
      hec-url: https://splunk.example.sa:8088/services/collector/event
      hec-token: ${SPLUNK_HEC_TOKEN:}
      default-index: tss_grc
      default-sourcetype: grc:event:json
      verify-ssl: true
      timeout-ms: 5000
      webhook-shared-secret: ${SPLUNK_WEBHOOK_SECRET:}
      retry:
        max-attempts: 3
        initial-delay-ms: 500
        backoff-multiplier: 2.0

    # CrowdStrike Falcon EDR bridge (slice 3 — see docs/integrations/CROWDSTRIKE.md).
    # OAuth2 client credentials; KSA-resident EU-1 cloud by default.
    # Pulls /detects into socops.security_event; pushes host containment
    # via /devices/entities/devices-actions/v2.
    crowdstrike:
      enabled: false                              # master kill-switch
      mode: STUB                                  # STUB (in-memory) | LIVE (real Falcon HTTPS)
      base-url: "https://api.eu-1.crowdstrike.com"
      client-id: ${CROWDSTRIKE_CLIENT_ID:}
      client-secret: ${CROWDSTRIKE_CLIENT_SECRET:}
      polling-interval-seconds: 60
      polling-enabled: false                      # independent — manual poll first, then enable loop
      retry:
        max-attempts: 3
        initial-delay-ms: 500
        backoff-multiplier: 2.0
      timeout-ms: 5000

    # Tenable.io / Tenable.sc VM bridge (slice 4 — see docs/integrations/TENABLE.md).
    # API key pair (X-ApiKeys header); choose platform=IO for cloud, SC for on-prem.
    # Pulls /vulns/export into cyber.vulnerabilities; pushes recast/accept-risk
    # decisions via the workbench endpoints. PDPL Art.29 — Tenable.io has no
    # KSA datacenter; banks needing KSA-resident data should pick SC on-prem.
    tenable:
      enabled: false                              # master kill-switch
      mode: STUB                                  # STUB (in-memory) | LIVE (real Tenable HTTPS)
      platform: IO                                # IO (cloud) | SC (on-prem Security Center)
      base-url: "https://cloud.tenable.com"
      access-key: ${TENABLE_ACCESS_KEY:}
      secret-key: ${TENABLE_SECRET_KEY:}
      polling-interval-seconds: 900               # 15 min — scans aggregate slowly vs EDR streaming
      polling-enabled: false                      # independent — manual poll first, then enable loop
      retry:
        max-attempts: 3
        initial-delay-ms: 500
        backoff-multiplier: 2.0
      timeout-ms: 5000

  # BCM module — Slice 9-D Continuity Strategy ROI
  # Discount rate used for NPV calculation across the planning horizon.
  # Default 8% = SAMA reference repo rate (2026 figure). Override via
  # GRC_BCM_ROI_DISCOUNT_RATE env var if SAMA changes the reference rate
  # without redeploying.
  bcm:
    roi:
      discount-rate: ${GRC_BCM_ROI_DISCOUNT_RATE:8.00}

  # Platform health checks
  # See docs/operations/sqlexpress-size-monitor.md for the runbook and
  # the F8 trigger DB_SIZE_THRESHOLD_BREACHED emitted on breach.
  health:
    db-size:
      warn-mb: ${GRC_DB_SIZE_WARN_MB:7168}        # 70% of 10 GB Express cap
      alert-mb: ${GRC_DB_SIZE_ALERT_MB:9216}       # 90%
      halt-mb: ${GRC_DB_SIZE_HALT_MB:9728}         # 95% — defensive cushion
      check-cron: ${GRC_DB_SIZE_CHECK_CRON:0 0 */6 * * *}   # every 6h on the hour
