<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:lang="${#locale.language}"
      th:dir="${#locale.language == 'ar' ? 'rtl' : 'ltr'}">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta name="theme-color" content="#1a2744"/>
    <!-- CSRF Token for AJAX requests -->
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>

    <title layout:title-pattern="$CONTENT_TITLE - TSS GRC Platform">TSS GRC Platform</title>

    <!-- Bootstrap 5 (RTL-aware) -->
    <th:block th:if="${#locale.language == 'ar'}">
        <link rel="stylesheet"
              href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css"/>
    </th:block>
    <th:block th:if="${#locale.language != 'ar'}">
        <link rel="stylesheet"
              href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    </th:block>

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>

    <!-- Platform CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
    <th:block th:if="${#locale.language == 'ar'}">
        <link rel="stylesheet" th:href="@{/css/rtl.css}"/>
    </th:block>

    <!-- Page-specific styles -->
    <th:block layout:fragment="page-styles"></th:block>
</head>
<body th:class="${#locale.language == 'ar' ? 'rtl-layout' : 'ltr-layout'}">

<!-- Sidebar Navigation -->
<div class="wrapper d-flex">
    <nav id="sidebar" class="sidebar">
        <!-- Logo -->
        <div class="sidebar-header p-3">
            <img th:src="@{/images/logo-white.svg}" alt="TSS" class="sidebar-logo" height="40"/>
            <span class="sidebar-brand" th:text="#{app.name}">TSS GRC</span>
        </div>

        <!-- Navigation Items -->
        <ul class="nav flex-column px-2">
            <li class="nav-item">
                <a class="nav-link" th:href="@{/dashboard}"
                   th:classappend="${currentPage == 'dashboard' ? 'active' : ''}">
                    <i class="bi bi-grid-1x2-fill"></i>
                    <span th:text="#{nav.dashboard}">Dashboard</span>
                </a>
            </li>

            <!-- Risk Management -->
            <li class="nav-item" sec:authorize="hasPermission('risk', 'READ')">
                <a class="nav-link" th:href="@{/risk}">
                    <i class="bi bi-shield-exclamation"></i>
                    <span th:text="#{nav.risk}">Risk Management</span>
                </a>
            </li>

            <!-- Cybersecurity -->
            <li class="nav-item" sec:authorize="hasPermission('cyber', 'READ')">
                <a class="nav-link" th:href="@{/cyber}">
                    <i class="bi bi-bug-fill"></i>
                    <span th:text="#{nav.cyber}">Cybersecurity</span>
                </a>
            </li>

            <!-- BCM -->
            <li class="nav-item" sec:authorize="hasPermission('bcm', 'READ')">
                <a class="nav-link" th:href="@{/bcm}">
                    <i class="bi bi-arrow-repeat"></i>
                    <span th:text="#{nav.bcm}">Business Continuity</span>
                </a>
            </li>

            <!-- Privacy -->
            <li class="nav-item" sec:authorize="hasPermission('privacy', 'READ')">
                <a class="nav-link" th:href="@{/privacy}">
                    <i class="bi bi-lock-fill"></i>
                    <span th:text="#{nav.privacy}">Privacy</span>
                </a>
            </li>

            <!-- Compliance -->
            <li class="nav-item" sec:authorize="hasPermission('compliance', 'READ')">
                <a class="nav-link" th:href="@{/compliance}">
                    <i class="bi bi-check-circle-fill"></i>
                    <span th:text="#{nav.compliance}">Compliance</span>
                </a>
            </li>

            <!-- Reports -->
            <li class="nav-item" sec:authorize="hasPermission('reporting', 'READ')">
                <a class="nav-link" th:href="@{/reports}">
                    <i class="bi bi-bar-chart-fill"></i>
                    <span th:text="#{nav.reports}">Reports</span>
                </a>
            </li>

            <!-- Admin -->
            <li class="nav-item" sec:authorize="hasRole('PLATFORM_ADMIN') or hasRole('ORG_ADMIN')">
                <a class="nav-link" th:href="@{/admin}">
                    <i class="bi bi-gear-fill"></i>
                    <span th:text="#{nav.admin}">Administration</span>
                </a>
            </li>
        </ul>
    </nav>

    <!-- Main Content -->
    <div class="main-content flex-grow-1 d-flex flex-column">
        <!-- Top Header -->
        <header class="top-header d-flex align-items-center px-4 py-2">
            <!-- Sidebar toggle -->
            <button id="sidebarToggle" class="btn btn-link text-dark me-3">
                <i class="bi bi-list fs-4"></i>
            </button>

            <!-- Page title -->
            <h5 class="mb-0 flex-grow-1" layout:fragment="page-title">Dashboard</h5>

            <!-- Header right: language switcher + notifications + user -->
            <div class="d-flex align-items-center gap-3">
                <!-- Language Switcher -->
                <div class="language-switcher">
                    <a th:href="@{''(lang=en)}"
                       class="btn btn-sm btn-outline-secondary"
                       th:classappend="${#locale.language == 'en' ? 'active' : ''}">EN</a>
                    <a th:href="@{''(lang=ar)}"
                       class="btn btn-sm btn-outline-secondary"
                       th:classappend="${#locale.language == 'ar' ? 'active' : ''}">عربي</a>
                </div>

                <!-- Notification Bell -->
                <div class="notification-bell position-relative">
                    <a href="#" class="btn btn-link text-dark p-0">
                        <i class="bi bi-bell fs-5"></i>
                        <span class="badge bg-danger notification-count"
                              id="notificationCount"
                              style="display:none">0</span>
                    </a>
                </div>

                <!-- User Menu -->
                <div class="dropdown">
                    <a href="#" class="dropdown-toggle text-dark text-decoration-none"
                       data-bs-toggle="dropdown">
                        <i class="bi bi-person-circle fs-5"></i>
                        <span sec:authentication="name" class="ms-1">User</span>
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li><a class="dropdown-item" th:href="@{/profile}">
                            <i class="bi bi-person me-2"></i>
                            <span th:text="#{nav.profile}">My Profile</span>
                        </a></li>
                        <li><hr class="dropdown-divider"/></li>
                        <li>
                            <form th:action="@{/logout}" method="post">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                <button type="submit" class="dropdown-item text-danger">
                                    <i class="bi bi-box-arrow-right me-2"></i>
                                    <span th:text="#{nav.logout}">Sign Out</span>
                                </button>
                            </form>
                        </li>
                    </ul>
                </div>
            </div>
        </header>

        <!-- Flash Messages -->
        <div class="px-4 pt-2">
            <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
                <i class="bi bi-check-circle me-2"></i>
                <span th:text="${successMessage}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <i class="bi bi-exclamation-circle me-2"></i>
                <span th:text="${errorMessage}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
        </div>

        <!-- Page Content -->
        <main class="flex-grow-1 p-4" layout:fragment="content">
            <!-- Page-specific content rendered here -->
        </main>

        <!-- Footer -->
        <footer class="footer py-2 px-4 text-muted small">
            <span th:text="#{app.company}">Trusted Security Solutions</span>
            &copy; <span th:text="${#dates.format(#dates.createNow(), 'yyyy')}">2025</span>
        </footer>
    </div>
</div>

<!-- Bootstrap 5 JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<!-- Chart.js 4 -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<!-- Platform JS -->
<script th:src="@{/js/app.js}"></script>

<!-- Page-specific scripts -->
<th:block layout:fragment="page-scripts"></th:block>

</body>
</html>
