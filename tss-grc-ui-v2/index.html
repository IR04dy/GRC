<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0E5E5E" />
    <!-- LH-06: declare a favicon so /login no longer logs a favicon.ico 404. -->
    <link rel="icon" type="image/svg+xml" href="/brand/favicon-placeholder.svg" />
    <title>TSS GRC Platform</title>
    <!-- LH-07: meta description for the SEO audit. -->
    <meta name="description" content="TSS GRC — a bilingual (Arabic/English) governance, risk and compliance platform for Saudi and MENA enterprises: risk registers, compliance frameworks (NCA, SAMA, PDPL, ISO), audits, incidents and reporting." />
    <!--
      Sprint 4 §2.7 — sockjs-client (used by @stomp/stompjs) is a CommonJS
      module that references `global`, which exists in Node.js but not in
      browsers. Polyfill it here so it's defined BEFORE any ES modules load.
      vite.config.ts also has `define: { global: 'globalThis' }` for prod build.
    -->
    <script>
      if (typeof window.global === 'undefined') window.global = window;
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
