<?xml version="1.0" encoding="UTF-8"?>
<!--
  Placeholder logo for dark themes — Open Issue #010.
  Replace with final TSS-supplied logo-dark.svg prior to go-live.
  Wordmark color: var(--ink-0) #FFFFFF on transparent.
  See public/brand/README.md for the full spec.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 240 64"
     width="240"
     height="64"
     role="img"
     aria-label="TSS GRC">
  <title>TSS GRC</title>
  <desc>TSS GRC platform wordmark placeholder, white on transparent, sized for dark-theme headers.</desc>

  <!-- Square mark on the left: rounded white-outlined tile with "T" cutout. -->
  <rect x="4" y="8" width="48" height="48" rx="10" ry="10"
        fill="none" stroke="#FFFFFF" stroke-width="2.5"/>
  <path d="M16 20 H40 V26 H30 V46 H26 V26 H16 Z" fill="#FFFFFF"/>

  <!-- Wordmark to the right of the mark. -->
  <text x="64" y="40"
        font-family="'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="24"
        font-weight="800"
        fill="#FFFFFF"
        letter-spacing="0.5">
    TSS GRC
  </text>

  <!-- Subtle baseline accent stroke (warm amber, same hue as light variant). -->
  <line x1="64" y1="48" x2="180" y2="48" stroke="#E8B547" stroke-width="2" stroke-linecap="round"/>
</svg>
