<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Compliance — TSS GRC</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
    <link rel="stylesheet" href="/assets/css/style.css"/>
    <link rel="stylesheet" href="/assets/css/rtl.css" id="rtl-css" disabled/>
    <style>
        .tab-nav { display:flex; gap:4px; background:var(--color-bg); padding:4px; border-radius:10px; margin-bottom:1.25rem; border:1px solid var(--color-border); }
        .tab-btn  { padding:8px 18px; border-radius:7px; border:none; background:none; font-size:12.5px; font-weight:700; color:var(--color-text-muted); cursor:pointer; font-family:inherit; white-space:nowrap; transition:all .18s; }
        .tab-btn:hover  { color:var(--grc-primary); background:rgba(15,76,53,.06); }
        .tab-btn.active { background:#fff; color:var(--grc-primary-d); box-shadow:0 1px 4px rgba(0,0,0,.1),0 0 0 1px var(--color-border); }
        .stats-kpi { display:grid; grid-template-columns:repeat(4,1fr); gap:1rem; margin-bottom:1.5rem; }
        @media(max-width:900px){ .stats-kpi{grid-template-columns:repeat(2,1fr)} }
        .stat-box { background:#fff; border:1px solid var(--color-border); border-radius:12px; padding:1rem 1.25rem; text-align:center; }
        .stat-num  { font-size:1.8rem; font-weight:900; color:var(--grc-primary); font-family:var(--font-mono,"IBM Plex Mono",monospace); letter-spacing:-1px; }
        .stat-lbl  { font-size:11px; color:var(--color-text-muted); margin-top:3px; font-weight:600; }
    </style>
</head>
<body>
<div id="app-shell"></div>
<main id="page-content" class="flex-grow-1 p-4">

    <!-- Header -->
    <div class="d-flex align-items-center justify-content-between mb-4">
        <div>
            <h5 class="fw-800 mb-0" style="font-size:1.1rem">
                <i class="bi bi-check-circle-fill me-2" style="color:var(--grc-primary)"></i>
                <span data-i18n="compliance.title">Compliance &amp; Controls</span>
            </h5>
            <div class="text-muted" style="font-size:0.78rem">Control Library · Assessments · Findings</div>
        </div>
        <button class="btn btn-sm btn-primary" id="btnAddItem" style="background:var(--grc-grad);border:none">
            <i class="bi bi-plus-lg me-1"></i> Add Control
        </button>
    </div>

    <!-- Stats row -->
    <div class="stats-kpi" id="statsRow">
        <div class="stat-box"><div class="stat-num skeleton" style="min-height:2rem">—</div><div class="stat-lbl">Total Controls</div></div>
        <div class="stat-box"><div class="stat-num skeleton" style="min-height:2rem">—</div><div class="stat-lbl">Implemented</div></div>
        <div class="stat-box"><div class="stat-num skeleton" style="min-height:2rem">—</div><div class="stat-lbl">Open Findings</div></div>
        <div class="stat-box"><div class="stat-num skeleton" style="min-height:2rem">—</div><div class="stat-lbl">Compliance Rate</div></div>
    </div>

    <!-- Tab nav -->
    <div class="tab-nav" id="tabNav">
        <button class="tab-btn active" data-tab="controls">🛡️ <span data-i18n="compliance.tab.controls">Controls</span></button>
        <button class="tab-btn" data-tab="assessments">📋 <span data-i18n="compliance.tab.internal">Internal Audit</span></button>
        <button class="tab-btn" data-tab="external">🏛️ <span data-i18n="compliance.tab.external">External Audit</span></button>
        <button class="tab-btn" data-tab="findings">⚠️ <span data-i18n="compliance.tab.findings">Findings</span></button>
        <button class="tab-btn" data-tab="scorecard">📊 <span data-i18n="compliance.tab.scorecard">Scorecard</span></button>
    </div>

    <!-- Tab content -->
    <div id="tabContent"></div>

</main>

<!-- ── Add/Edit Modal ──────────────────────────────────────────────────────── -->
<div class="modal fade" id="itemModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header" style="background:var(--grc-grad);color:#fff">
                <h5 class="modal-title fw-800" id="modalTitle">Add Control</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body" id="modalBody"></div>
            <div class="modal-footer">
                <button class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
                <button class="btn btn-sm text-white fw-700" id="btnSave"
                        style="background:var(--grc-grad);border:none">Save</button>
            </div>
        </div>
    </div>
</div>

<!-- Confirm delete -->
<div class="modal fade" id="confirmModal" tabindex="-1">
    <div class="modal-dialog modal-sm">
        <div class="modal-content text-center p-4">
            <div style="font-size:2.5rem">🗑️</div>
            <h6 class="fw-800 mt-2">Delete Item?</h6>
            <p class="text-muted small">This action cannot be undone.</p>
            <div class="d-flex gap-2 justify-content-center mt-3">
                <button class="btn btn-sm btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button class="btn btn-sm btn-danger" id="btnConfirmDelete">Delete</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<script src="/assets/js/translations.js"></script>
<script src="/assets/js/auth.js"></script>
<script src="/assets/js/i18n.js"></script>
<script src="/assets/js/config.js"></script>
<script src="/assets/js/api.js"></script>
<script src="/assets/js/app.js"></script>
<script>
(async function(){
'use strict';

let currentTab = 'controls';
let editId = null;
let deleteId = null;
let deleteEndpoint = null;
const modal    = new bootstrap.Modal('#itemModal');
const confirmM = new bootstrap.Modal('#confirmModal');

// ── Tab switching ──────────────────────────────────────────────────────────
document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
        btn.classList.add('active');
        currentTab = btn.dataset.tab;
        const addBtn = document.getElementById('btnAddItem');
        addBtn.style.display = ['external','scorecard'].includes(currentTab) ? 'none' : '';
        addBtn.innerHTML = currentTab === 'controls'     ? '<i class="bi bi-plus-lg me-1"></i> Add Control'
                         : currentTab === 'assessments'  ? '<i class="bi bi-plus-lg me-1"></i> Add Assessment'
                         : currentTab === 'findings'     ? '<i class="bi bi-plus-lg me-1"></i> Add Finding'
                         :                                 '<i class="bi bi-plus-lg me-1"></i> Add';
        loadTab();
    });
});

// ── Load stats ─────────────────────────────────────────────────────────────
async function loadStats(){
    try {
        const s = await Api.get('/compliance/stats');
        document.getElementById('statsRow').innerHTML = `
            <div class="stat-box"><div class="stat-num">${s.totalControls}</div><div class="stat-lbl">Total Controls</div></div>
            <div class="stat-box"><div class="stat-num" style="color:var(--color-success)">${s.implementedControls}</div><div class="stat-lbl">Implemented</div></div>
            <div class="stat-box"><div class="stat-num" style="color:var(--color-danger)">${s.openFindings}</div><div class="stat-lbl">Open Findings</div></div>
            <div class="stat-box"><div class="stat-num">${Math.round(s.overallComplianceRate)}%</div><div class="stat-lbl">Compliance Rate</div></div>`;
    } catch(_){}
}

// ── Tab loaders ────────────────────────────────────────────────────────────
async function loadTab(){
    const el = document.getElementById('tabContent');
    el.innerHTML = `<div class="text-center py-5"><div class="spinner-border text-success" style="color:var(--grc-primary)!important"></div></div>`;
    try {
        if(currentTab === 'controls')    await loadControls(el);
        if(currentTab === 'assessments') await loadAssessments(el);
        if(currentTab === 'findings')    await loadFindings(el);
        if(currentTab === 'external')    await loadExternalAudit(el);
        if(currentTab === 'scorecard')   await loadScorecard(el);
    } catch(e){
        el.innerHTML = `<div class="alert alert-danger">${e.message || 'Failed to load data'}</div>`;
    }
}

// Framework badge colors
const fwColor = {
    'ISO_27001':'#0284c7','NCA_ECC':'#0f4c35','PDPL':'#7c3aed',
    'ISO_22301':'#d97706','ISO_31000':'#dc2626','SDAIA':'#0369a1'
};
const fwLabel = {
    'ISO_27001':'ISO 27001','NCA_ECC':'NCA ECC','PDPL':'PDPL',
    'ISO_22301':'ISO 22301','ISO_31000':'ISO 31000','SDAIA':'SDAIA'
};
const matBadge = n => `<span class="maturity-badge maturity-${n}">${n}</span>`;
const statusBadge = s => {
    const map = { IMPLEMENTED:'badge-green', PARTIAL:'badge-yellow', PLANNED:'badge-gray', NOT_APPLICABLE:'badge-blue' };
    return `<span class="badge ${map[s]||'badge-gray'}">${s}</span>`;
};
const sevBadge = s => {
    const map = { CRITICAL:'badge-red', HIGH:'badge-orange', MEDIUM:'badge-yellow', LOW:'badge-green' };
    return `<span class="badge ${map[s]||'badge-gray'}">${s}</span>`;
};
const fwBadge = fw => `<span style="background:${fwColor[fw]||'#64748b'}22;color:${fwColor[fw]||'#64748b'};padding:2px 8px;border-radius:20px;font-size:10px;font-weight:700">${fwLabel[fw]||fw}</span>`;

// ── Controls ───────────────────────────────────────────────────────────────
async function loadControls(el){
    const data = await Api.get('/compliance/controls?size=100&sort=code,asc');
    const rows = data.content ?? [];
    if(!rows.length){ el.innerHTML = emptyState('🛡️','No controls yet','Add your first control using the button above'); return; }
    el.innerHTML = `
    <div class="card">
        <div class="card-body p-0">
        <div class="table-responsive">
        <table class="table table-hover mb-0">
            <thead><tr>
                <th data-i18n="label.code">Code</th><th data-i18n="label.name">Name</th><th data-i18n="label.framework">Framework</th><th data-i18n="label.domain">Domain</th>
                <th data-i18n="label.maturity">Maturity</th><th data-i18n="label.status">Status</th><th data-i18n="label.owner">Owner</th><th data-i18n="label.actions">Actions</th>
            </tr></thead>
            <tbody>
            ${rows.map(c=>`<tr>
                <td><code style="font-size:11px;color:var(--grc-primary)">${c.code}</code></td>
                <td style="max-width:200px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${c.nameEn}</td>
                <td>${fwBadge(c.framework)}</td>
                <td style="font-size:12px">${c.domain||'—'}</td>
                <td>${matBadge(c.maturityLevel||1)}</td>
                <td>${statusBadge(c.status)}</td>
                <td style="font-size:12px">${c.owner||'—'}</td>
                <td>
                    <div class="d-flex gap-1">
                        <button class="btn btn-sm btn-secondary" onclick="openEdit('controls',${c.id})">
                            <i class="bi bi-pencil"></i></button>
                        <button class="btn btn-sm btn-danger" onclick="openDelete('controls',${c.id})">
                            <i class="bi bi-trash"></i></button>
                    </div>
                </td>
            </tr>`).join('')}
            </tbody>
        </table>
        </div>
        </div>
    </div>`;
    if (typeof I18n !== 'undefined') I18n.applyTranslations();
}

// ── Assessments ────────────────────────────────────────────────────────────
async function loadAssessments(el){
    const data = await Api.get('/compliance/assessments?size=50');
    const rows = data.content ?? [];
    if(!rows.length){ el.innerHTML = emptyState('📋','No assessments yet','Create your first assessment'); return; }
    el.innerHTML = `
    <div class="card">
        <div class="card-body p-0">
        <div class="table-responsive">
        <table class="table table-hover mb-0">
            <thead><tr>
                <th data-i18n="label.framework">Framework</th><th data-i18n="label.period">Period</th><th data-i18n="label.auditor">Auditor</th>
                <th data-i18n="label.score">Score</th><th data-i18n="label.status">Status</th><th data-i18n="label.date">Date</th><th data-i18n="label.actions">Actions</th>
            </tr></thead>
            <tbody>
            ${rows.map(a=>{
                const score = a.score != null ? a.score : null;
                const scoreColor = score >= 80 ? 'var(--color-success)' : score >= 60 ? 'var(--color-warning)' : 'var(--color-danger)';
                return `<tr>
                    <td>${fwBadge(a.framework)}</td>
                    <td style="font-size:12px">${a.period||'—'}</td>
                    <td style="font-size:12px">${a.auditor||'—'}</td>
                    <td><strong style="color:${scoreColor}">${score!=null?score+'%':'—'}</strong></td>
                    <td>${statusBadge(a.status)}</td>
                    <td style="font-size:11px;font-family:monospace">${a.assessmentDate?.substring(0,10)||'—'}</td>
                    <td>
                        <button class="btn btn-sm btn-secondary" onclick="openEdit('assessments',${a.id})">
                            <i class="bi bi-pencil"></i></button>
                    </td>
                </tr>`;
            }).join('')}
            </tbody>
        </table>
        </div>
        </div>
    </div>`;
    if (typeof I18n !== 'undefined') I18n.applyTranslations();
}

// ── Findings ───────────────────────────────────────────────────────────────
async function loadFindings(el){
    const data = await Api.get('/compliance/findings?size=100');
    const rows = data.content ?? [];
    if(!rows.length){ el.innerHTML = emptyState('⚠️','No findings yet','Record your first audit finding'); return; }
    el.innerHTML = `
    <div class="card">
        <div class="card-body p-0">
        <div class="table-responsive">
        <table class="table table-hover mb-0">
            <thead><tr>
                <th>#</th><th data-i18n="label.title">Title</th><th data-i18n="label.severity">Severity</th><th data-i18n="label.owner">Owner</th>
                <th data-i18n="label.due.date">Due Date</th><th data-i18n="label.status">Status</th><th data-i18n="label.actions">Actions</th>
            </tr></thead>
            <tbody>
            ${rows.map((f,i)=>`<tr>
                <td style="font-size:11px;font-family:monospace;color:var(--color-text-muted)">${i+1}</td>
                <td style="max-width:220px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${f.title}</td>
                <td>${sevBadge(f.severity)}</td>
                <td style="font-size:12px">${f.owner||'—'}</td>
                <td style="font-size:11px;font-family:monospace">${f.dueDate?.substring(0,10)||'—'}</td>
                <td>${statusBadge(f.status)}</td>
                <td>
                    <div class="d-flex gap-1">
                        <button class="btn btn-sm btn-secondary" onclick="openEdit('findings',${f.id})">
                            <i class="bi bi-pencil"></i></button>
                        <button class="btn btn-sm btn-danger" onclick="openDelete('findings',${f.id})">
                            <i class="bi bi-trash"></i></button>
                    </div>
                </td>
            </tr>`).join('')}
            </tbody>
        </table>
        </div>
        </div>
    </div>`;
    if (typeof I18n !== 'undefined') I18n.applyTranslations();
}

// ── Modal forms ────────────────────────────────────────────────────────────
function controlForm(d){
    return `
    <div class="row g-3">
        <div class="col-md-4">
            <label class="form-label fw-700 small text-uppercase">Code *</label>
            <input class="form-control" id="fCode" value="${d?.code||''}" placeholder="ISO27001-A.5.1">
        </div>
        <div class="col-md-8">
            <label class="form-label fw-700 small text-uppercase">Name (EN) *</label>
            <input class="form-control" id="fNameEn" value="${d?.nameEn||''}" placeholder="Control name">
        </div>
        <div class="col-md-8">
            <label class="form-label fw-700 small text-uppercase">Name (AR)</label>
            <input class="form-control" id="fNameAr" value="${d?.nameAr||''}" placeholder="اسم الضابط" dir="rtl">
        </div>
        <div class="col-md-4">
            <label class="form-label fw-700 small text-uppercase">Framework *</label>
            <select class="form-select" id="fFramework">
                ${['ISO_27001','NCA_ECC','PDPL','ISO_22301','ISO_31000','SDAIA'].map(f=>
                    `<option value="${f}" ${d?.framework===f?'selected':''}>${fwLabel[f]||f}</option>`).join('')}
            </select>
        </div>
        <div class="col-md-6">
            <label class="form-label fw-700 small text-uppercase">Domain</label>
            <input class="form-control" id="fDomain" value="${d?.domain||''}" placeholder="e.g. Access Control">
        </div>
        <div class="col-md-3">
            <label class="form-label fw-700 small text-uppercase">Maturity (1-5)</label>
            <select class="form-select" id="fMaturity">
                ${[1,2,3,4,5].map(n=>`<option value="${n}" ${(d?.maturityLevel||1)==n?'selected':''}>${n}</option>`).join('')}
            </select>
        </div>
        <div class="col-md-3">
            <label class="form-label fw-700 small text-uppercase">Status</label>
            <select class="form-select" id="fStatus">
                ${['PLANNED','PARTIAL','IMPLEMENTED','NOT_APPLICABLE'].map(s=>
                    `<option value="${s}" ${(d?.status||'PLANNED')===s?'selected':''}>${s}</option>`).join('')}
            </select>
        </div>
        <div class="col-md-6">
            <label class="form-label fw-700 small text-uppercase">Owner</label>
            <input class="form-control" id="fOwner" value="${d?.owner||''}" placeholder="e.g. CISO">
        </div>
        <div class="col-12">
            <label class="form-label fw-700 small text-uppercase">Description</label>
            <textarea class="form-control" id="fDesc" rows="2">${d?.description||''}</textarea>
        </div>
    </div>`;
}

function assessmentForm(d){
    return `
    <div class="row g-3">
        <div class="col-md-6">
            <label class="form-label fw-700 small text-uppercase">Framework *</label>
            <select class="form-select" id="fFramework">
                ${['ISO_27001','NCA_ECC','PDPL','ISO_22301','ISO_31000','SDAIA'].map(f=>
                    `<option value="${f}" ${d?.framework===f?'selected':''}>${fwLabel[f]||f}</option>`).join('')}
            </select>
        </div>
        <div class="col-md-6">
            <label class="form-label fw-700 small text-uppercase">Period</label>
            <input class="form-control" id="fPeriod" value="${d?.period||''}" placeholder="e.g. Q1 2026">
        </div>
        <div class="col-md-6">
            <label class="form-label fw-700 small text-uppercase">Auditor</label>
            <input class="form-control" id="fAuditor" value="${d?.auditor||''}" placeholder="Auditor name">
        </div>
        <div class="col-md-3">
            <label class="form-label fw-700 small text-uppercase">Score %</label>
            <input type="number" class="form-control" id="fScore" value="${d?.score||''}" min="0" max="100" placeholder="0-100">
        </div>
        <div class="col-md-3">
            <label class="form-label fw-700 small text-uppercase">Status</label>
            <select class="form-select" id="fStatus">
                ${['PLANNED','IN_PROGRESS','COMPLETED'].map(s=>
                    `<option value="${s}" ${(d?.status||'PLANNED')===s?'selected':''}>${s}</option>`).join('')}
            </select>
        </div>
        <div class="col-md-6">
            <label class="form-label fw-700 small text-uppercase">Assessment Date</label>
            <input type="date" class="form-control" id="fDate" value="${d?.assessmentDate?.substring(0,10)||''}">
        </div>
        <div class="col-12">
            <label class="form-label fw-700 small text-uppercase">Notes</label>
            <textarea class="form-control" id="fNotes" rows="2">${d?.notes||''}</textarea>
        </div>
    </div>`;
}

function findingForm(d){
    return `
    <div class="row g-3">
        <div class="col-12">
            <label class="form-label fw-700 small text-uppercase">Title *</label>
            <input class="form-control" id="fTitle" value="${d?.title||''}" placeholder="Finding title">
        </div>
        <div class="col-md-4">
            <label class="form-label fw-700 small text-uppercase">Severity *</label>
            <select class="form-select" id="fSeverity">
                ${['CRITICAL','HIGH','MEDIUM','LOW'].map(s=>
                    `<option value="${s}" ${(d?.severity||'HIGH')===s?'selected':''}>${s}</option>`).join('')}
            </select>
        </div>
        <div class="col-md-4">
            <label class="form-label fw-700 small text-uppercase">Status</label>
            <select class="form-select" id="fStatus">
                ${['OPEN','IN_PROGRESS','REMEDIATED','VERIFIED','CLOSED'].map(s=>
                    `<option value="${s}" ${(d?.status||'OPEN')===s?'selected':''}>${s}</option>`).join('')}
            </select>
        </div>
        <div class="col-md-4">
            <label class="form-label fw-700 small text-uppercase">Due Date</label>
            <input type="date" class="form-control" id="fDue" value="${d?.dueDate?.substring(0,10)||''}">
        </div>
        <div class="col-md-6">
            <label class="form-label fw-700 small text-uppercase">Owner</label>
            <input class="form-control" id="fOwner" value="${d?.owner||''}" placeholder="Owner">
        </div>
        <div class="col-12">
            <label class="form-label fw-700 small text-uppercase">CAPA (Corrective Action)</label>
            <textarea class="form-control" id="fCapa" rows="2">${d?.capa||''}</textarea>
        </div>
    </div>`;
}

// ── Open add/edit modal ────────────────────────────────────────────────────
window.openEdit = async function(type, id){
    editId = id || null;
    let data = null;
    if(id){
        try { data = await Api.get(`/compliance/${type}/${id}`); } catch(_){}
    }
    const titles = { controls:'Control', assessments:'Assessment', findings:'Finding' };
    document.getElementById('modalTitle').textContent = (id?'Edit ':'Add ') + titles[type];
    document.getElementById('modalBody').innerHTML =
        type === 'controls'    ? controlForm(data)
      : type === 'assessments' ? assessmentForm(data)
      :                          findingForm(data);
    document.getElementById('btnSave').onclick = () => saveItem(type, id);
    modal.show();
};

document.getElementById('btnAddItem').addEventListener('click', () => openEdit(currentTab, null));

async function saveItem(type, id){
    let body;
    if(type === 'controls'){
        body = {
            code:        document.getElementById('fCode').value,
            nameEn:      document.getElementById('fNameEn').value,
            nameAr:      document.getElementById('fNameAr').value || null,
            framework:   document.getElementById('fFramework').value,
            domain:      document.getElementById('fDomain').value || null,
            maturityLevel: +document.getElementById('fMaturity').value,
            status:      document.getElementById('fStatus').value,
            owner:       document.getElementById('fOwner').value || null,
            description: document.getElementById('fDesc').value || null,
        };
    } else if(type === 'assessments'){
        body = {
            framework:      document.getElementById('fFramework').value,
            period:         document.getElementById('fPeriod').value || null,
            auditor:        document.getElementById('fAuditor').value || null,
            score:          document.getElementById('fScore').value ? +document.getElementById('fScore').value : null,
            status:         document.getElementById('fStatus').value,
            assessmentDate: document.getElementById('fDate').value || null,
            notes:          document.getElementById('fNotes').value || null,
        };
    } else {
        body = {
            title:    document.getElementById('fTitle').value,
            severity: document.getElementById('fSeverity').value,
            status:   document.getElementById('fStatus').value,
            dueDate:  document.getElementById('fDue').value || null,
            owner:    document.getElementById('fOwner').value || null,
            capa:     document.getElementById('fCapa').value || null,
        };
    }
    try {
        if(id) await Api.put(`/compliance/${type}/${id}`, body);
        else   await Api.post(`/compliance/${type}`, body);
        modal.hide();
        loadStats();
        loadTab();
        App.showFlash('success', id ? 'Updated successfully' : 'Created successfully');
    } catch(e){
        App.showFlash('danger', e.message || 'Save failed');
    }
}

// ── Delete ─────────────────────────────────────────────────────────────────
window.openDelete = function(type, id){
    deleteId = id; deleteEndpoint = `/compliance/${type}/${id}`;
    confirmM.show();
};
document.getElementById('btnConfirmDelete').addEventListener('click', async () => {
    try {
        await Api.delete(deleteEndpoint);
        confirmM.hide();
        loadStats(); loadTab();
        App.showFlash('success', 'Deleted');
    } catch(e){ App.showFlash('danger', e.message||'Delete failed'); }
});

// ── External Audit ─────────────────────────────────────────────────────────
async function loadExternalAudit(el){
    // Use assessments API, filter or show all as external context
    let rows = [];
    try {
        const data = await Api.get('/compliance/assessments?size=50');
        rows = data.content ?? [];
    } catch(_) {}

    // KPI Cards (matching GRC.html 6-card layout)
    const total     = rows.length;
    const completed = rows.filter(r => r.status === 'COMPLETED').length;
    const inProg    = rows.filter(r => r.status === 'IN_PROGRESS').length;
    const planned   = rows.filter(r => r.status === 'PLANNED').length;
    const avgScore  = rows.length ? Math.round(rows.reduce((s,r)=>(s+(r.score||0)),0)/rows.length) : 0;

    const kpiData = [
        {l:'Total Audits',      v:total,     c:'#7c3aed', bg:'#f5f3ff'},
        {l:'Completed',         v:completed, c:'#059669', bg:'#dcfce7'},
        {l:'In Progress',       v:inProg,    c:'#d97706', bg:'#fff7ed'},
        {l:'Planned',           v:planned,   c:'#2563eb', bg:'#dbeafe'},
        {l:'Avg Score',         v:avgScore+'%', c:'#0f4c35', bg:'#f0fdf4'},
        {l:'Frameworks',        v:6,         c:'#6b7280', bg:'#f8fafc'},
    ];

    const fwColorMap = {'ISO_27001':'#0f4c35','NCA_ECC':'#2563eb','PDPL':'#7c3aed','ISO_22301':'#0891b2','ISO_31000':'#dc2626','SDAIA':'#0369a1'};
    const statusBadgeExt = s => {
        const m = {PLANNED:'badge-blue',IN_PROGRESS:'badge-orange',COMPLETED:'badge-green'};
        return `<span class="badge ${m[s]||'badge-gray'}">${(s||'').replace('_',' ')}</span>`;
    };

    el.innerHTML = `
    <!-- 6 KPI cards -->
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:16px">
        ${kpiData.map(k=>`
        <div style="background:${k.bg};border-radius:10px;padding:14px;text-align:center;border:1px solid ${k.c}20">
            <div style="font-size:1.5rem;font-weight:900;color:${k.c}">${k.v}</div>
            <div style="font-size:10px;font-weight:700;color:${k.c};margin-top:2px">${k.l}</div>
        </div>`).join('')}
    </div>

    <!-- External Audit Table -->
    <div class="card mb-3">
        <div class="card-body p-0">
        <div class="d-flex align-items-center justify-content-between px-3 py-2" style="border-bottom:1px solid var(--color-border)">
            <span class="fw-700" style="font-size:.88rem">🏛️ External Audit Register <span class="badge ms-2" style="background:#ede9fe;color:#7c3aed;font-size:.7rem">${total}</span></span>
        </div>
        <div class="table-responsive">
        <table class="table table-hover mb-0" style="font-size:12px">
            <thead><tr>
                <th data-i18n="label.framework">Audit / Framework</th>
                <th data-i18n="label.auditor">Auditing Body</th>
                <th data-i18n="label.period">Period</th>
                <th class="text-center" data-i18n="label.score">Score</th>
                <th>Rating</th>
                <th data-i18n="label.status">Status</th>
            </tr></thead>
            <tbody>
            ${!rows.length ? `<tr><td colspan="6"><div class="empty-state py-3"><i class="bi bi-building empty-state-icon"></i><p>No external audits yet. Add assessments in the Internal Audit tab.</p></div></td></tr>` :
            rows.map(a => {
                const fwC = fwColorMap[a.framework] || '#6b7280';
                const score = a.score;
                const scoreColor = score >= 80 ? '#059669' : score >= 60 ? '#d97706' : '#dc2626';
                const rating = score >= 80 ? 'Satisfactory' : score >= 60 ? 'Needs Improvement' : score != null ? 'Unsatisfactory' : '—';
                const ratingBg = score >= 80 ? '#dcfce7' : score >= 60 ? '#fff7ed' : '#fee2e2';
                const ratingC  = score >= 80 ? '#059669' : score >= 60 ? '#d97706' : '#dc2626';
                return `<tr>
                    <td>
                        <div style="font-weight:700">${a.framework ? fwLabel[a.framework]||a.framework : '—'}</div>
                        ${a.notes ? `<div style="font-size:10px;color:var(--color-text-muted)">${a.notes.substring(0,50)}</div>` : ''}
                    </td>
                    <td>${a.auditor || '—'}</td>
                    <td style="font-family:monospace;font-size:11px">${a.period || (a.assessmentDate ? a.assessmentDate.substring(0,10) : '—')}</td>
                    <td class="text-center"><strong style="color:${scoreColor}">${score != null ? score+'%' : '—'}</strong></td>
                    <td><span style="background:${ratingBg};color:${ratingC};padding:2px 8px;border-radius:20px;font-size:10px;font-weight:700">${rating}</span></td>
                    <td>${statusBadgeExt(a.status)}</td>
                </tr>`;
            }).join('')}
            </tbody>
        </table>
        </div>
        </div>
    </div>`;
}

// ── Scorecard ──────────────────────────────────────────────────────────────
let _scorecardChart = null;
async function loadScorecard(el){
    let rows = [];
    try {
        const data = await Api.get('/compliance/assessments?size=50');
        rows = data.content ?? [];
    } catch(_) {}

    // Aggregate scores by framework
    const frameworks = ['ISO_27001','NCA_ECC','PDPL','ISO_22301','ISO_31000','SDAIA'];
    const scoreMap   = {};
    frameworks.forEach(f => { scoreMap[f] = []; });
    rows.forEach(r => { if (r.framework && scoreMap[r.framework]) scoreMap[r.framework].push(r.score || 0); });
    const fwScores = frameworks.map(f => ({
        fw: fwLabel[f] || f,
        fwKey: f,
        score: scoreMap[f].length ? Math.round(scoreMap[f].reduce((a,b)=>a+b,0)/scoreMap[f].length) : 0,
        count: scoreMap[f].length,
    }));

    const fwColorMap = {'ISO_27001':'#1a6b3c','NCA_ECC':'#2e8b57','PDPL':'#7c3aed','ISO_22301':'#0891b2','ISO_31000':'#dc2626','SDAIA':'#0369a1'};

    el.innerHTML = `
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:1.25rem">
        <!-- Radar Chart -->
        <div class="card" style="padding:1.25rem">
            <h6 class="fw-800 mb-3" style="font-size:.88rem">📊 Compliance Radar</h6>
            <div style="position:relative;height:300px"><canvas id="scorecardRadar"></canvas></div>
        </div>
        <!-- Framework Scores Table -->
        <div class="card" style="padding:1.25rem">
            <h6 class="fw-800 mb-3" style="font-size:.88rem">🏷️ Framework Scores</h6>
            <div style="display:flex;flex-direction:column;gap:10px">
            ${fwScores.map(f => {
                const c = fwColorMap[f.fwKey] || '#0f4c35';
                const pct = f.score;
                return `<div>
                    <div class="d-flex justify-content-between mb-1">
                        <span style="font-size:.82rem;font-weight:700">${f.fw}</span>
                        <span style="font-size:.82rem;font-weight:900;color:${c}">${pct}%</span>
                    </div>
                    <div style="height:8px;background:#e5e7eb;border-radius:4px;overflow:hidden">
                        <div style="height:100%;width:${pct}%;background:${c};border-radius:4px;transition:width .6s"></div>
                    </div>
                    <div style="font-size:.7rem;color:var(--color-text-muted);margin-top:2px">${f.count} assessment${f.count!==1?'s':''}</div>
                </div>`;
            }).join('')}
            </div>
        </div>
    </div>`;

    // Radar chart
    if (_scorecardChart) { _scorecardChart.destroy(); _scorecardChart = null; }
    setTimeout(() => {
        const ctx = document.getElementById('scorecardRadar');
        if (ctx) _scorecardChart = new Chart(ctx, {
            type: 'radar',
            data: {
                labels: fwScores.map(f => f.fw),
                datasets: [{
                    label: 'Compliance %',
                    data: fwScores.map(f => f.score),
                    backgroundColor: 'rgba(15,76,53,0.12)',
                    borderColor: '#0f4c35',
                    borderWidth: 2,
                    pointBackgroundColor: '#0f4c35',
                    pointRadius: 5,
                }]
            },
            options: {
                responsive:true, maintainAspectRatio:false,
                scales: { r: { beginAtZero:true, max:100,
                    ticks:{ stepSize:20, callback:v=>v+'%', font:{size:10}, color:'#64748b' },
                    grid:{ color:'rgba(0,0,0,0.06)' },
                    pointLabels:{ font:{size:11,weight:'600'} }
                } },
                plugins:{ legend:{ display:false } }
            }
        });
    }, 150);
}

function emptyState(icon, title, sub){
    return `<div class="coming-soon-page"><span class="coming-soon-icon">${icon}</span>
            <div class="coming-soon-title">${title}</div>
            <div class="coming-soon-sub">${sub}</div></div>`;
}
